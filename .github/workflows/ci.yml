name: ci

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: |
          set -o pipefail
          npm ci --no-audit --no-fund
      # The site builds without a database (data-backed pages render a "pending" state),
      # so CI verifies the build with no secrets required. Pushes to main are built and
      # deployed by deploy.yml instead.
      - run: npm run build
