# Build the Astro site from the database and deploy it to Cloudflare Workers (static assets).
#
# One deploy path only (decided 2026-09-06): this workflow. Cloudflare's git-connected
# Workers Builds is deliberately NOT enabled for this repo, so nothing races it.
# Runs on: push to main, manual dispatch, and as the last stage of ingest.yml (workflow_call)
# so fresh data goes live in the same run that fetched it.
#
# Lessons baked in (docs/reference/learnings-nsnexplorer.md):
#   - `set -o pipefail` before any piped step — a masked build failure once shipped a broken
#     site for weeks on a sibling project.
#   - Migrations run before the build so the schema always exists when pages read it.
#   - DATABASE_URL is the Supabase SESSION pooler string (port 5432), never the Transaction
#     pooler (6543) — db/migrate.mjs refuses the latter.
#   - The deploy is verified by Cloudflare's API (the new version serves 100% of traffic) and by
#     fetching the live site, not by wrangler's exit code. Since 2026-10-11 Bot Fight Mode
#     challenges GitHub's runners; a challenge is reported as inconclusive, never as a failure,
#     and the discovery checks also run on the build itself before it ships.

name: deploy

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "shared/**"
      - "db/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/verify-live.mjs"
      - "scripts/probe-live.mjs"
      - "scripts/check-deployed-version.mjs"
      - "scripts/lib/**"
      - "scripts/indexnow-ping.mjs"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
  workflow_call:
    secrets:
      DATABASE_URL:
        required: true
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PUBLIC_SITE_URL: https://spotthemoney.com
      PUBLIC_CF_ANALYTICS_TOKEN: ${{ vars.PUBLIC_CF_ANALYTICS_TOKEN }}
      PUBLIC_AD_CLIENT: ${{ vars.PUBLIC_AD_CLIENT }}
      ASTRO_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"
    steps:
      # Always build the newest main, whatever commit started this run. An ingest or backfill
      # run that began before a push used to redeploy ITS older commit when it finished, which
      # took a just-shipped feature off the site (the Market cap filter, 2026-10-05).
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install
        run: |
          set -o pipefail
          npm ci --no-audit --no-fund

      - name: Apply migrations
        run: node db/migrate.mjs

      - name: Build site from the database
        run: |
          set -o pipefail
          npm run build --workspace=@stm/web 2>&1 | tee build.log
          # Since 2026-10-10 the site has on-demand routes (sign-in and the watchlist API), so the
          # adapter writes a Worker config under dist/server/; a fully static build writes it
          # under dist/client/. Deploy whichever exists.
          test -f web/dist/server/wrangler.json || test -f web/dist/client/wrangler.json

      # Discovery plumbing must be valid in every build (roadmap B.2): sitemap index + children,
      # robots.txt AI allow lines, llms.txt, JSON-LD on a sample of pages, no empty tables, no
      # "Soon" tags. Checked on the exact files about to ship, served from this runner, so a
      # Cloudflare challenge can never hide a regression (2026-10-12). Fails before deploying.
      - name: Check the build (sitemaps, robots, llms.txt, JSON-LD)
        run: |
          set -o pipefail
          (cd web/dist/client && python3 -m http.server 4321 --bind 127.0.0.1 >/dev/null 2>&1 &)
          sleep 2
          node scripts/verify-live.mjs http://127.0.0.1:4321 --sample 5 --fail-on-challenge

      - name: Deploy to Cloudflare Workers
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          cfg=dist/server/wrangler.json
          [ -f "$cfg" ] || cfg=dist/client/wrangler.json
          echo "deploying with $cfg"
          echo "cfg=$cfg" >> "$GITHUB_ENV"
          npx wrangler deploy --config "$cfg" 2>&1 | tee ../deploy.log

      # Proof that the deploy worked, from Cloudflare's API: the version just uploaded must serve
      # 100% of traffic. Unlike fetching the website, this cannot be blocked by Bot Fight Mode,
      # which challenges GitHub's runners since 2026-10-11 (and cannot be skipped by WAF rules).
      - name: Verify the deployed version
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx wrangler deployments status --config "$cfg" --json > ../deploy-status.json
          node ../scripts/check-deployed-version.mjs ../deploy.log ../deploy-status.json

      # Is the new build serving on the public domain? Passes on HTTP 200 + expected text, fails
      # on 5xx / 404 / wrong content, and reports a Cloudflare challenge as INCONCLUSIVE (a
      # warning, not a failure) — scripts/probe-live.mjs.
      - name: Verify the live site
        run: node scripts/probe-live.mjs "${PUBLIC_SITE_URL}/rates/i-bonds/?v=${GITHUB_SHA}" "I-Bond Rate Today"

      # The same discovery checks against the public domain, after one edge TTL. Challenged
      # requests are inconclusive (warning); anything that does come back must pass.
      - name: Verify sitemaps, robots, llms.txt and JSON-LD (live)
        run: |
          set -o pipefail
          sleep 120   # prerendered HTML carries s-maxage=120; wait one edge TTL so we test the new build
          node scripts/verify-live.mjs "$PUBLIC_SITE_URL" --sample 5

      # Tell IndexNow engines which pages changed (lastmod within 2 days). Best-effort.
      - name: IndexNow ping
        run: node scripts/indexnow-ping.mjs
