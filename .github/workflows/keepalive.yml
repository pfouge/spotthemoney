# GitHub disables scheduled workflows in a PUBLIC repository after 60 days without a commit.
# This site is meant to run unattended, so once a month this workflow makes an empty commit
# to main. It needs the default GITHUB_TOKEN with contents:write (set below).

name: keepalive

on:
  schedule:
    - cron: "17 6 1 * *"   # 06:17 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: write

jobs:
  touch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Empty commit
        run: |
          git config user.name "spotthemoney-bot"
          git config user.email "pfouge@gmail.com"
          git commit --allow-empty -m "chore: keepalive (scheduled workflows stay enabled)"
          git push
