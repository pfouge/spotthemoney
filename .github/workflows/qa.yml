# QA copy of the site: main plus EVERY article that is not live yet.
#
# Builds main with the articles, authors and images of all open pull requests against main added on
# top (scripts/pending-articles.sh), with PUBLIC_SHOW_DRAFTS=1 so unpublished articles (marked draft or
# dated in the future) are included with a banner and noindex. It deploys the result as a separate
# Worker "spotthemoney-qa" on https://qa.spotthemoney.com, and keeps ONE comment on each included pull
# request with the links (marker: <!-- stm-qa -->), so the repo owner and the article author are
# notified by GitHub. https://qa.spotthemoney.com/writing/ lists every article not live yet.
#
# Every run rebuilds the whole picture, so the newest run wins (concurrency "qa", cancel in progress).
# It runs when a pull request is opened, updated, reopened, marked ready or closed (a closed or merged
# pull request drops out of the picture), when main changes, and on demand: Actions > qa > Run workflow.
# publish.yml triggers it after it merges pull requests.
#
# Safety rails:
#   - From each pull request ONLY files under web/src/content/articles/, web/src/content/authors/ and
#     web/public/writing/ are used, and only from branches of this repository. No code, workflow or
#     package file of a pull request is ever taken, so a pull request cannot run its own code here.
#     (A fork gets no secrets and is not built.)
#   - The production Worker name and routes are never touched. The generated wrangler.json is
#     rewritten before the deploy (name spotthemoney-qa, route qa.spotthemoney.com only).
#   - The QA site is not indexable: X-Robots-Tag noindex on every static response and a
#     robots.txt that disallows everything. No IndexNow ping, no live checks, no search engine call.
#   - db/migrate.mjs is NOT run here: a pull request must never change the production schema.
#     QA builds against the schema main already applied.

name: qa

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]
    branches: [main]
    paths:
      - "web/src/content/**"
      - "web/public/writing/**"
  push:
    branches: [main]
    paths:
      - "web/src/content/**"
      - "web/public/writing/**"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

# One QA build at a time, the newest wins. A pull request from a fork is not built (no secrets), so its
# events get their own group and must not cancel a real build.
concurrency:
  group: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && format('qa-fork-{0}', github.run_id) || 'qa' }}
  cancel-in-progress: true

jobs:
  qa:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PUBLIC_SITE_URL: https://spotthemoney.com
      PUBLIC_CF_ANALYTICS_TOKEN: ${{ vars.PUBLIC_CF_ANALYTICS_TOKEN }}
      PUBLIC_AD_CLIENT: ${{ vars.PUBLIC_AD_CLIENT }}
      PUBLIC_SHOW_DRAFTS: "1"
      ASTRO_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"
    steps:
      # Always main, whatever started this run: the pending articles are laid over it below.
      - uses: actions/checkout@v4
        with:
          ref: main

      # Open pull requests against main from this repository (drafts included), oldest first; the
      # article, author and image files of each are copied over main. Writes pending.json.
      - name: Add the pending articles to main
        run: bash scripts/pending-articles.sh qa

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install
        run: |
          set -o pipefail
          npm ci --no-audit --no-fund

      - name: Build site from the database
        run: |
          set -o pipefail
          npm run build --workspace=@stm/web 2>&1 | tee build.log
          test -f web/dist/server/wrangler.json || test -f web/dist/client/wrangler.json

      - name: Make the QA copy un-indexable
        working-directory: web/dist/client
        run: |
          set -euo pipefail
          touch _headers
          printf '\n/*\n  X-Robots-Tag: noindex, nofollow\n' >> _headers
          printf 'User-agent: *\nDisallow: /\n' > robots.txt

      - name: Deploy to Cloudflare Workers as spotthemoney-qa
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          cfg=dist/server/wrangler.json
          [ -f "$cfg" ] || cfg=dist/client/wrangler.json
          node -e '
            const fs = require("fs");
            const f = process.argv[1];
            const c = JSON.parse(fs.readFileSync(f, "utf8"));
            c.name = "spotthemoney-qa";
            c.routes = [{ pattern: "qa.spotthemoney.com", custom_domain: true }];
            fs.writeFileSync(f, JSON.stringify(c, null, 2));
          ' "$cfg"
          node -e 'const c=require("./"+process.argv[1]); console.log("worker:", c.name, "routes:", JSON.stringify(c.routes)); if (c.name !== "spotthemoney-qa" || c.routes.length !== 1 || c.routes[0].pattern !== "qa.spotthemoney.com") process.exit(1)' "$cfg"
          echo "deploying with $cfg"
          npx wrangler deploy --config "$cfg"

      # One comment (marker <!-- stm-qa -->) on every pull request in the picture: created once,
      # edited on later runs (and left alone when nothing changed).
      - name: Comment on the pull requests
        run: |
          set -euo pipefail
          main_short=$(jq -r '.main_sha[0:7]' pending.json)
          publish_url="https://github.com/$REPO/actions/workflows/publish.yml"
          while IFS= read -r pr; do
            n=$(jq -r '.number' <<<"$pr")
            head_short=$(jq -r '.sha[0:7]' <<<"$pr")
            {
              echo '<!-- stm-qa -->'
              echo '**QA ready**'
              echo
              if [ "$(jq '.articles | length' <<<"$pr")" -gt 0 ]; then
                jq -r '.articles[] | "- Article: https://qa.spotthemoney.com/writing/\(.)/"' <<<"$pr"
              else
                echo '- This pull request has no article file; its author and image files are in the QA copy.'
              fi
              echo '- All articles not live yet: https://qa.spotthemoney.com/writing/'
              echo
              echo "Main commit \`$main_short\`, pull request head \`$head_short\`."
              echo
              echo 'QA copy only, not indexed.'
              if [ "$(jq '.other | length' <<<"$pr")" -gt 0 ]; then
                echo
                echo "This pull request also changes $(jq '.other | length' <<<"$pr") file(s) outside articles, authors and images. QA does not use them, and publish skips this pull request."
              fi
              echo
              echo "To put every pending article live: [Actions → publish → Run workflow]($publish_url). To publish only this one, merge this pull request."
            } > qa-comment.md
            existing=$(gh api --paginate "repos/$REPO/issues/$n/comments" \
                         --jq '[.[] | select(.body | contains("<!-- stm-qa -->"))][0] // empty | [.id, .body] | @json' | head -1 || true)
            if [ -n "$existing" ]; then
              id=$(jq -r '.[0]' <<<"$existing")
              if [ "$(jq -r '.[1]' <<<"$existing" | tr -d '\r')" = "$(cat qa-comment.md)" ]; then
                echo "#$n: comment is up to date"
                continue
              fi
              gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@qa-comment.md > /dev/null
              echo "#$n: comment updated"
            else
              gh api -X POST "repos/$REPO/issues/$n/comments" -F body=@qa-comment.md > /dev/null
              echo "#$n: comment created"
            fi
          done < <(jq -c '.prs[] | select(.included)' pending.json)

      # The build or deploy failed: tell the pull request that started this run (a pull request event),
      # with a link to the run. Runs for pushes and manual runs have no pull request to tell.
      - name: Comment on the pull request when QA failed
        if: failure() && github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo '<!-- stm-qa -->'
            echo '**QA failed**'
            echo
            echo "The QA build with pull request head \`${SHA:0:7}\` did not finish. See the run: $RUN_URL"
          } > qa-comment.md
          id=$(gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" \
                 --jq '.[] | select(.body | contains("<!-- stm-qa -->")) | .id' | head -1 || true)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@qa-comment.md > /dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" -F body=@qa-comment.md > /dev/null
          fi
