# Scheduled data refresh, then redeploy so the static site reflects the new data.
#
# Shape (2026-09-27): migrate once, then the sources run as PARALLEL groups so the daily
# batch stays inside the job budget as sources are added (sec_form4 alone is ~30 min cold).
# Each group runs `npm run ingest -- <sources…>` in order; a group's failure does not stop
# the others, and the retry job re-runs only the failed groups on a fresh runner (new IP).
# The deploy runs whenever the migrate job succeeded — it rebuilds from whatever is in the
# database, so one bad source never blocks fresh data from the rest. (Until 2026-10-04 the
# condition tested the matrix result, which is "failure" if ANY group fails; with FEC 403ing
# daily, the deploy was skipped for a week.) The last job, `freshness`, reads `ingest_runs`
# (the diagnostic of record) and fails the run — GitHub emails it — if any configured source
# is stale or failing; the table lands in the run summary.
#
# Not in the daily batch (run by their own workflows or by hand): x_daily (x-daily.yml),
# citation_count / search_console_weekly (measure.yml), archive_backfill (dispatch here).

name: ingest

on:
  schedule:
    # Off the top of the hour: GitHub delays :00 schedules heavily (these ran ~5 h late).
    - cron: "17 9 * * *" # daily 09:17 UTC (congress-ptr runs separately at 13:23, see its workflow)
  workflow_dispatch:
    inputs:
      source:
        description: "Source(s) to run, space-separated (blank = the daily groups)"
        required: false
        default: ""

concurrency:
  group: ingest
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: "1"

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: |
          set -o pipefail
          npm ci --no-audit --no-fund
      - name: Apply migrations
        run: node db/migrate.mjs
      # The ticker universe must exist before the parallel groups start: sec_form4 and
      # twelvedata_eod read it from `securities` and no-op when it is empty (ingest #1,
      # 2026-09-27, ran sec_form4 before the rates group had seeded it).
      - name: Seed the ticker universe
        run: |
          set -o pipefail
          npm run ingest -- universe

  ingest:
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        group:
          - name: rates
            sources: congress_roster ibonds treasury_yield_curve treasury_real_yield_curve bls_cpi
          - name: filings
            sources: sec_form4
          - name: money
            sources: senate_lda usaspending fec_committees fec_schedule_a
          - name: prices
            sources: twelvedata_eod
    name: ingest (${{ matrix.group.name }})
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
      TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
      LDA_API_KEY: ${{ secrets.LDA_API_KEY }}
      BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: |
          set -o pipefail
          npm ci --no-audit --no-fund
      - name: Run ingest
        run: |
          set -o pipefail
          if [ -n "${{ github.event.inputs.source }}" ]; then
            # Manual run: only the "rates" matrix slot executes the requested source(s).
            if [ "${{ matrix.group.name }}" = "rates" ]; then npm run ingest -- ${{ github.event.inputs.source }}; else echo "skipped (manual run)"; fi
          else
            npm run ingest -- ${{ matrix.group.sources }}
          fi

  # Fresh runner (new IP) if a government source blocked the first attempt.
  ingest-retry:
    needs: ingest
    if: always() && contains(needs.ingest.result, 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
      TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
      LDA_API_KEY: ${{ secrets.LDA_API_KEY }}
      BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: |
          set -o pipefail
          npm ci --no-audit --no-fund
      - name: Run ingest (retry, all daily sources — already-ingested rows are skipped)
        run: npm run ingest -- ${{ github.event.inputs.source }}

  # Rebuild + deploy from the refreshed database (same pipeline as a push to main).
  deploy:
    needs: [migrate, ingest, ingest-retry]
    if: always() && needs.migrate.result == 'success'
    uses: ./.github/workflows/deploy.yml
    secrets:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # Autopilot monitor: one row per source in the run summary; red run = something is stale.
  freshness:
    needs: [migrate, ingest, ingest-retry, deploy]
    if: always() && needs.migrate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: |
          set -o pipefail
          npm ci --no-audit --no-fund
      - name: Freshness check (every source, publish backlog, party coverage)
        run: node scripts/freshness-check.mjs
