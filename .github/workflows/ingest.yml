# Scheduled data refresh, then redeploy so the static site reflects the new data.
# I-Bond rates change only on May 1 / Nov 1, so daily is ample for the rates hub; the
# per-source cadence in `sources.cadence` decides what each job actually fetches on a run.
# Higher-frequency sources (prices) move to Cloudflare Cron Triggers later (docs/01 §5).
#
# `ingest_runs` in the database is the diagnostic of record — when a run looks wrong,
# query it rather than reading these logs.

name: ingest

on:
  schedule:
    - cron: "0 9 * * *" # daily 09:00 UTC
  workflow_dispatch:
    inputs:
      source:
        description: "Source to run (blank = all registered sources)"
        required: false
        default: ""

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Supabase SESSION pooler string (port 5432) — see SETUP.md §2.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Job keys — each job is a safe no-op (or runs keyless) when its key is absent.
      FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
      TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
      LDA_API_KEY: ${{ secrets.LDA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install
        run: |
          set -o pipefail
          npm ci --no-audit --no-fund
      - name: Apply migrations
        run: node db/migrate.mjs
      - name: Run ingest
        run: npm run ingest -- ${{ github.event.inputs.source }}

  # Fresh runner (new IP) if a government source blocked the first attempt.
  ingest-retry:
    needs: ingest
    if: always() && needs.ingest.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
      TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
      LDA_API_KEY: ${{ secrets.LDA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install
        run: |
          set -o pipefail
          npm ci --no-audit --no-fund
      - name: Run ingest (retry)
        run: npm run ingest -- ${{ github.event.inputs.source }}

  # Rebuild + deploy from the refreshed database (same pipeline as a push to main).
  deploy:
    needs: [ingest, ingest-retry]
    if: always() && (needs.ingest.result == 'success' || needs.ingest-retry.result == 'success')
    uses: ./.github/workflows/deploy.yml
    secrets:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
